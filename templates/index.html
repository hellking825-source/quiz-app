<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quiz App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
        }
        h1 { color: #333; }
        p { color: #666; }
        input[type="text"] {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }
        label {
            display: block;
            text-align: left;
            font-size: 14px;
            color: #555;
            margin-top: 10px;
        }
        button.button {
            display: inline-block;
            width: 100%;
            margin-top: 20px;
            padding: 12px 30px;
            background: #4CAF50;
            color: white;
            border: none;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        button.button:hover { background: #45a049; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Welcome to the Quiz!</h1>
        <p>This quiz has {{ total_questions }} questions. Answer them one by one and see your score at the end.</p>
        <form method="POST" action="{{ url_for('start') }}">
            <label for="name">Your Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required>

            <label for="student_class">Your Class</label>
            <input type="text" id="student_class" name="student_class" placeholder="e.g. 10th, B.Tech 2nd Year" required>

            <button class="button" type="submit">Start Quiz</button>
        </form>
    </div>
</body>
</html>
